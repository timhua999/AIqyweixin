[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiqyweixin"
version = "0.1.0"
description = "企业微信国际物流智能机器人（单租户 MVP）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pycryptodome>=3.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[project.scripts]
aiqyweixin-serve = "aiqyweixin.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# 若使用 uv：uv sync && uv run aiqyweixin-serve
